<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - FirewallGuard Security Console</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/custom.css') }}">
  <style>
    body {
      background: radial-gradient(circle at 50% 10%, #0f244a 0%, #070a12 70%);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 1.5rem;
    }
    .login-card {
      background: rgba(19, 28, 46, 0.95);
      border: 1px solid var(--border-highlight);
      border-radius: 16px;
      padding: 2.75rem 2.25rem;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8), 0 0 30px rgba(6, 182, 212, 0.15);
    }
  </style>
</head>
<body>

<div class="login-card text-center">
  <div class="brand-icon mx-auto mb-3" style="width: 58px; height: 58px; font-size: 2rem;">
    <i class="bi bi-shield-lock-fill"></i>
  </div>
  <h2 class="fw-bold text-white mb-1">FirewallGuard</h2>
  <p class="text-secondary small mb-4">Windows Firewall Rule Management & Network Traffic Filtering System</p>

  {% if error %}
  <div class="alert alert-danger py-2 px-3 small d-flex align-items-center gap-2 mb-3 text-start border-danger">
    <i class="bi bi-exclamation-triangle-fill fs-5"></i>
    <div>{{ error }}</div>
  </div>
  {% endif %}

  <form method="POST" action="{{ url_for('login') }}" class="text-start" id="loginForm">
    <div class="mb-3">
      <label class="form-label" for="username">Username</label>
      <div class="input-group">
        <span class="input-group-text bg-dark border-secondary text-secondary"><i class="bi bi-person"></i></span>
        <input type="text" class="form-control" id="username" name="username" placeholder="Enter username" 
               required minlength="3" maxlength="30" autocomplete="username" autofocus value="{{ username or '' }}">
      </div>
    </div>

    <div class="mb-4">
      <div class="d-flex align-items-center justify-content-between mb-1">
        <label class="form-label mb-0" for="password">Password</label>
      </div>
      <div class="input-group">
        <span class="input-group-text bg-dark border-secondary text-secondary"><i class="bi bi-key"></i></span>
        <input type="password" class="form-control" id="password" name="password" placeholder="Enter password" 
               required minlength="4" autocomplete="current-password">
        <button class="btn btn-outline-secondary" type="button" id="togglePwd" title="Show/Hide Password">
          <i class="bi bi-eye"></i>
        </button>
      </div>
    </div>

    <button type="submit" class="btn btn-primary-glow w-100 py-2 fs-6">
      <i class="bi bi-shield-check me-2"></i> Authenticate & Enter
    </button>
  </form>

  <div class="mt-4 pt-3 border-top border-secondary text-center text-muted small">
    <span>Information Assurance & Security 2</span>
  </div>
</div>

<script>
  const togglePwd = document.getElementById('togglePwd');
  const pwdInput = document.getElementById('password');
  if (togglePwd && pwdInput) {
    togglePwd.addEventListener('click', () => {
      const isPwd = pwdInput.type === 'password';
      pwdInput.type = isPwd ? 'text' : 'password';
      togglePwd.innerHTML = isPwd ? '<i class="bi bi-eye-slash"></i>' : '<i class="bi bi-eye"></i>';
    });
  }
</script>

</body>
</html>
